# The PRIMARY documented outward-facing boundary for this engine (the deployment boundary): nginx
# terminates TLS, authenticates callers with client certificates, and forwards to the
# orchestrator's loopback listener.
#
# This is the recommended path over `cmd/gateway` for the plain reason that most
# operators already run a reverse proxy: configuring a component you already trust
# beats trusting a new binary of ours on the security path. `cmd/gateway` exists for
# deployments that would rather not add one.
#
# WHY THE PROXY IS REQUIRED AT ALL. The the control-plane API has no authentication and no TLS, by
# design rather than by omission: the engine non-goals excludes the credential family from the engine
# permanently, because every byte the engine can hand a guest is readable by uid 0
# inside it, so the engine cannot be a secrecy boundary for anything. The engine's
# contribution to this boundary is the other half — it REFUSES a non-loopback --addr
# at startup — so with this proxy in front, it is the only outward-facing surface by
# construction rather than by an operator remembering.
#
# The TLS/client-auth portions were verified against nginx 1.28.3 with an h2c
# upstream; the checks are recorded per block below:
#   - a caller with no client certificate            → 400 (No required SSL certificate)
#   - a caller with a certificate from another CA    → 400 (SSL certificate error)
#   - a caller with a certificate from the named CA  → 200, and the upstream sees it
#   - a server-streamed response                     → arrives incrementally, spread preserved
#   - the four X-Forwarded-* / identity headers      → absent at the upstream

server {
    # The outward-facing listener. Unlike the orchestrator's, this one is MEANT to be
    # routable — it authenticates.
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name khora.internal;

    # --- the server's own identity ---
    ssl_certificate     /etc/nginx/certs/server.pem;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # TLS 1.3 only. This is a new deployment surface with no installed base to be
    # compatible with, so there is nothing to weigh against the floor.
    ssl_protocols TLSv1.3;

    # --- authenticating the CALLER (this is the boundary) ---
    #
    # Scope this bundle to a CA you issue from. A public bundle here authenticates the
    # entire internet: verification would succeed for any certificate chaining to any
    # well-known root, which is indistinguishable from no authentication at all.
    ssl_client_certificate /etc/nginx/certs/client-ca.pem;
    #
    # `on`, never `optional`. With `optional`, verification failure has to be caught
    # by a conditional in each location, and a location added later without that
    # conditional is an unauthenticated path into a control plane that can create
    # root-capable sandboxes. `on` refuses during the handshake, so a new location
    # cannot forget.
    #
    # Measured with `on`: no certificate → 400 "No required SSL certificate was sent";
    # a certificate from an untrusted CA → 400 "The SSL certificate error". Both
    # refusals happen before the request is proxied, so the upstream sees nothing.
    ssl_verify_client on;
    ssl_verify_depth  2;

    # The engine's HTTP handler serves REST, Connect, and gRPC on the same listener.
    # HTTP proxying is required for REST and Connect (including /v1/... and health
    # endpoints); grpc_pass is selected only for requests whose content type identifies
    # the gRPC wire protocol.  This keeps normal curl/CLI/Connect traffic working while
    # preserving an HTTP/2-capable h2c upstream for native gRPC clients.
    location / {
        error_page 418 = @grpc;
        if ($http_content_type ~* "^application/grpc(?:\\+[^;]+)?(?:;|$)") {
            return 418;
        }

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
        proxy_socket_keepalive on;
        proxy_request_buffering off;
        proxy_buffering off;

        # The upload endpoint streams whole files in one request body, so a size cap
        # here is a cap on what a caller may write into a sandbox. 0 = unlimited;
        # set it to the largest upload this deployment intends to allow.
        client_max_body_size 0;
    }

    location @grpc {
        grpc_pass grpc://127.0.0.1:8080;

        # LONG-LIVED STREAMS. The default read timeout is 60s, which would sever any
        # process stream idle for a minute — an interactive shell waiting at a prompt,
        # a build printing nothing for a while. These are the values that make
        # `process Start`/`Connect` and a PTY usable; raise them further if a
        # deployment's sessions are longer.
        grpc_read_timeout 24h;
        grpc_send_timeout 24h;
        grpc_socket_keepalive on;

        # NO CALLER IDENTITY IS FORWARDED, and that is deliberate. nginx can pass the
        # verified certificate on ($ssl_client_escaped_cert, $ssl_client_s_dn), and
        # this config does not, because the engine has no authorization subject and
        # the engine vocabulary boundary bars the names one would need. Authentication is COMPLETE at this hop:
        # a request that reaches the engine has already been authenticated, and that
        # is the entire contract between the two processes. Adding an identity header
        # here is how an authorization concept enters a system that has none.
        #
        # The inbound forms are cleared for the same reason — a caller must not be
        # able to inject them.
        grpc_set_header X-Forwarded-For   "";
        grpc_set_header X-Forwarded-Host  "";
        grpc_set_header X-Forwarded-Proto "";

        # NO BUFFERING DIRECTIVE IS NEEDED HERE, and that is a fact about this module
        # rather than an omission: `grpc_buffering` does not exist (nginx refuses the
        # config with "unknown directive" — this was tried), because the grpc module
        # forwards a response as it arrives. `grpc_buffer_size` sizes the read buffer,
        # one page by default, and is not a whole-body buffer. Measured through this
        # config: three chunks emitted 300 ms apart arrived with the spread intact.
        #
        # The upload endpoint streams whole files in one request body, so a size cap
        # here is a cap on what a caller may write into a sandbox. 0 = unlimited;
        # set it to the largest upload this deployment intends to allow.
        client_max_body_size 0;
    }
}
