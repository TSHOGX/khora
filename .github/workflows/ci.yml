name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # The cheap gate: builds and unit tests, no substrate required
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build all packages
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Cross-compile check (amd64)
        run: GOARCH=amd64 go build ./...

      - name: Run unit tests
        run: go test ./...

      - name: Verify reproducible builds
        run: make verify-reproducible

  # Ask/§ consistency (ADR-0009). Cheap, no substrate. This CANNOT block a merge —
  # branch protection is unavailable on a private repo on this plan — so the pre-push
  # hook is the actual gate and this is the second opinion.
  asks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Register against the tracker
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/check-asks.sh

  # The substrate suite: needs root, runsc, btrfs, and real kernel features.
  # Runs on self-hosted runner with the prerequisites installed.
  substrate:
    runs-on: [ self-hosted, linux, btrfs, runsc ]
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Run substrate suite
        run: sudo env "PATH=$PATH" "HOME=$HOME" go test -tags substrate -count=1 -p 1 ./...

      # The tagged files live under ./test/, not ./internal/lifecycle — pointing this at
      # the wrong package returned "[no tests to run]" and a GREEN step, so the §4.2
      # drain-barrier test goal.md names as the one that must pass was never executed.
      # `-run` is what makes the mistake loud: a target with no matching test now fails
      # instead of passing vacuously.
      - name: Assert the drainrace target is not empty
        run: test "$(go test -tags 'substrate,drainrace' -list 'TestPauseDrain.*' ./test/ | grep -c '^TestPauseDrain')" -ge 1

      - name: Run drainrace tests
        run: sudo env "PATH=$PATH" "HOME=$HOME" go test -tags 'substrate,drainrace' -count=1 -p 1 -run 'TestPauseDrain' ./test/

      - name: Run quotachurn tests
        run: sudo env "PATH=$PATH" "HOME=$HOME" go test -tags 'substrate,quotachurn' -count=1 -p 1 ./internal/btrfs
