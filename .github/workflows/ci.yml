name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # The cheap gate: builds and unit tests, no substrate required
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.23'

      - name: Verify generated output
        run: |
          buf_path="${RUNNER_TEMP}/buf"
          curl -fsSL -o "$buf_path" https://github.com/bufbuild/buf/releases/download/v1.47.2/buf-Linux-x86_64
          echo "3a0c4da8d46eea8136affa63db202c76a44f8112384160b73c3fffb1cf14b5d8  $buf_path" | sha256sum -c -
          chmod 0755 "$buf_path"
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.35.2
          go install connectrpc.com/connect/cmd/protoc-gen-connect-go@v1.17.0
          export PATH="${RUNNER_TEMP}:$(go env GOPATH)/bin:$PATH"
          ./scripts/check-generated.sh

      - name: Verify retired references stay absent
        run: ./scripts/test-check-retired-references.sh

      - name: Build all packages
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Cross-compile check (amd64)
        run: GOARCH=amd64 go build ./...

      - name: Run unit tests
        run: go test ./...

      - name: Verify reproducible builds
        run: make verify-reproducible
