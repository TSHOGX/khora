name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # The cheap gate: builds and unit tests, no substrate required
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Set up Buf
        uses: bufbuild/buf-setup-action@v1
        with:
          version: '1.47.2'

      - name: Verify generated output
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.35.2
          go install connectrpc.com/connect/cmd/protoc-gen-connect-go@v1.17.0
          export PATH="$(go env GOPATH)/bin:$PATH"
          ./scripts/check-generated.sh

      - name: Build all packages
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Cross-compile check (amd64)
        run: GOARCH=amd64 go build ./...

      - name: Run unit tests
        run: go test ./...

      - name: Verify reproducible builds
        run: make verify-reproducible
