// Package engine.transport.v1 is the §5.E wire contract: the two stateless RPC
// services the engine exposes (process / fs) plus a Health probe. This is the
// schema-first source (Task S); host client stub + guest server stub generate
// from it. Connect-RPC over h2c (transport D4.2).
//
// M3 scope (transport D4.3, plan §5): the full process data plane —
// Start / Connect (server-stream) / StreamInput (client-stream) /
// SendInput / SendSignal / Update / CloseStdin / List; fs.Read / Write; Health.
// keepalive is a ProcessEvent variant on long output streams (D4.2). fs breadth
// (List/Stat/MakeDir/Remove/Move + multipart bypass) is a post-M3 increment.
//
// Vocabulary boundary (§1.1): NO agent / session / turn / tag — process is
// addressed by guest-native pid only (transport D4.6).
syntax = "proto3";

package engine.transport.v1;

option go_package = "engine/internal/transport/gen/engine/transport/v1;transportv1";

// Health is the unary readiness/liveness probe (§4.3 L2 / transport D4.5). Its
// first success is the resume readiness gate that flips a sandbox to running
// (guest-runtime D5.2 要点①) — the engine never trusts a bare TCP accept.
service HealthService {
  rpc Check(CheckRequest) returns (CheckResponse) {}
}

message CheckRequest {}
message CheckResponse {
  bool ok = 1;
}

// ProcessService is the §5.E process primitive: start / connect / input /
// signal / resize / list. PTY is the pty-field special case of Start (transport
// D4.3), not a service. Output is fan-out multi-subscribe: many Connect can
// attach one pid, each gets an independent copy (D4.3 multi-connection).
service ProcessService {
  // Start launches a process and server-streams its output events
  // (start / data / end / keepalive). Addressed by the returned pid thereafter.
  rpc Start(StartRequest) returns (stream ProcessEvent) {}

  // Connect reattaches to an already-running process, replaying the bounded
  // output ring buffer first, then joining the live stream (transport D4.3
  // invariant 2). Multiple Connect can attach one pid (§3.2 multi-connection).
  rpc Connect(ConnectRequest) returns (stream ProcessEvent) {}

  // StreamInput writes stdin (or pty-in) as an ordered client-stream — the
  // interactive input path (keystrokes to a pty). Ordering is guaranteed by the
  // single stream (transport D4.3).
  rpc StreamInput(stream StreamInputRequest) returns (StreamInputResponse) {}

  // SendInput writes stdin (or pty-in) once — unary, for when no stream is held.
  rpc SendInput(SendInputRequest) returns (SendInputResponse) {}

  // SendSignal signals a process; server defaults to the process group
  // (kill(-pgid)) falling back to kill(pid) (transport D4.3 / §5.E.1).
  rpc SendSignal(SendSignalRequest) returns (SendSignalResponse) {}

  // Update resizes a process's PTY (unary; not a separate service, a process
  // field — transport D4.3).
  rpc Update(UpdateRequest) returns (UpdateResponse) {}

  // CloseStdin closes a process's stdin (under a pty, equivalent to Ctrl-D).
  rpc CloseStdin(CloseStdinRequest) returns (CloseStdinResponse) {}

  // List enumerates live processes — no registry, scanned in real time (§5.E).
  rpc List(ListRequest) returns (ListResponse) {}
}

message StartRequest {
  string cmd = 1;
  repeated string args = 2;
  repeated string env = 3;
  string cwd = 4;
  // guest_user is the per-Start run-as (like `sudo -u`, §6.2) — NOT the sandbox
  // default identity. Empty = inherit.
  //
  // NOT YET ENFORCED (deferred): sandboxd currently ignores this field and execs
  // every process as the guest default (root, §2.2). Wiring the run-as
  // (SysProcAttr.Credential via guest user-lookup) is a scoped follow-on; until
  // then a non-empty guest_user is silently NOT applied. Tracked in the M-series
  // plan / open-decisions §5.E. Not a host-isolation gap (§2.2: guest identity
  // is guest-internal hygiene, not a security pillar), but a documented-API param
  // that fails open — do not rely on it for in-guest privilege separation yet.
  string guest_user = 5;
  // pty, when set, allocates a PTY of the given size (transport D4.3).
  PtySize pty = 6;
}

message PtySize {
  uint32 rows = 1;
  uint32 cols = 2;
}

// ProcessEvent is one item of the output stream: oneof{start,data,end,
// keepalive} (transport D4.3). keepalive is emitted periodically on long idle
// streams so intermediaries/clients know the connection is alive and don't
// reap it on silence (transport D4.2 — no idle read/write deadline).
message ProcessEvent {
  oneof kind {
    StartEvent start = 1;
    DataEvent data = 2;
    EndEvent end = 3;
    KeepaliveEvent keepalive = 4;
  }
}

message StartEvent {
  int32 pid = 1;
}

message DataEvent {
  // stream: "stdout" | "stderr" | "pty".
  string stream = 1;
  bytes data = 2;
}

message EndEvent {
  int32 exit_code = 1;
}

// KeepaliveEvent carries no payload — its arrival is the liveness signal.
message KeepaliveEvent {}

message ConnectRequest {
  int32 pid = 1;
}

// StreamInputRequest is one frame of the ordered input stream. pid is only read
// on the first frame of the stream (the stream targets one process).
message StreamInputRequest {
  int32 pid = 1;
  bytes data = 2;
  // pty_in selects the pty branch (write to the pty master) vs stdin.
  bool pty_in = 3;
}
message StreamInputResponse {}

message SendInputRequest {
  int32 pid = 1;
  bytes data = 2;
  // pty_in selects the pty branch (write to the pty master) vs stdin.
  bool pty_in = 3;
}
message SendInputResponse {}

message UpdateRequest {
  int32 pid = 1;
  PtySize pty = 2;
}
message UpdateResponse {}

message CloseStdinRequest {
  int32 pid = 1;
}
message CloseStdinResponse {}

message SendSignalRequest {
  int32 pid = 1;
  int32 signal = 2;
}
message SendSignalResponse {}

message ListRequest {}
message ListResponse {
  repeated int32 pids = 1;
}

// FsService is the §5.E fs primitive. M1: Read (offset) / Write. No watch —
// consumers poll Stat+Read (transport D2 / D4.4). List/Stat/etc grow later.
service FsService {
  // Read reads sandbox file bytes at an offset. The engine keeps no read
  // cursor and no cross-resume offset continuity (transport D4.4).
  rpc Read(ReadRequest) returns (ReadResponse) {}

  // Write writes sandbox file bytes (whole-file, offset 0 in M1).
  rpc Write(WriteRequest) returns (WriteResponse) {}
}

message ReadRequest {
  string path = 1;
  int64 offset = 2;
  // length <= 0 means "to EOF".
  int64 length = 3;
}
message ReadResponse {
  bytes data = 1;
}

message WriteRequest {
  string path = 1;
  bytes data = 2;
}
message WriteResponse {
  int64 bytes_written = 1;
}
