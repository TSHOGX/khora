// Package khora.transport.v1 defines the transport data plane: two stateless RPC
// services the engine exposes (process / fs) plus a Health probe. It is the
// schema-first source of truth; host client stub + guest server stub generate
// from it. The carrier is Connect-RPC over h2c.
//
// Process data plane: Start / Connect (server-stream) /
// StreamInput (client-stream) / SendInput / SendSignal / Update / CloseStdin /
// List. keepalive is a ProcessEvent variant on long output streams.
//
// Fs data plane: Read (offset) / Write / Stat / List (depth) /
// MakeDir / Remove / Move, all unary and no watch. Large files do NOT grow a
// chunked RPC — they use the streaming HTTP bypass on the guest's same listener
// (GET|PUT /files?path=), because what matters is that neither end holds the whole
// file, not the message size.
//
// Product vocabulary does not enter the wire contract: processes are addressed by
// guest-native pid, with no agent, session, turn, or tag fields.
syntax = "proto3";

package khora.transport.v1;

option go_package = "github.com/TSHOGX/khora/pkg/transport/gen/khora/transport/v1;transportv1";

// Health is the unary readiness and liveness probe. Its first success is the
// resume readiness gate that flips a sandbox to running; the engine never trusts
// a bare TCP accept. It is also the activity probe: one RPC carries guest
// liveness AND the sandbox-global idle duration, so the reaper never needs a
// second round-trip to tell healthy from idle.
service HealthService {
  rpc Check(CheckRequest) returns (CheckResponse) {}

  // RecordActivity stamps the sandbox-global activity clock Check reports,
  // meaning "this sandbox is doing something right now" while carrying no
  // duration. It is the write half of the same signal, which is
  // why it lives on this service rather than inventing one.
  //
  // It exists because the clock is otherwise reachable from outside only by
  // writing to a process's stdin, i.e. the pipe a guest reads its own protocol
  // on — which would couple the reaper's idle criterion to EVERY guest protocol
  // ("must tolerate arbitrary ignorable input"). The other stamp points cannot
  // serve: the two stdin-close paths are one-shot and irreversible, and output
  // is not a caller's to trigger (and the case that needs this is a stretch
  // producing no output).
  //
  // NOT a lease / keepalive / pause-inhibit: those all carry a protected
  // PERIOD, and a period is what forces per-caller state, overlap arbitration,
  // and expiry — the obligations that put those shapes outside the extension boundary. Stamping
  // one timestamp the engine already owns has none of them, and afterwards is
  // indistinguishable from a keystroke.
  //
  // Being an in-guest RPC is load-bearing: a host-side
  // timestamp would manufacture an activity reading for a sandbox nobody can
  // reach, breaking the property that keeps "activity could not be probed" from
  // ever reading as idle. So this is unavailable exactly when Check is.
  rpc RecordActivity(RecordActivityRequest) returns (RecordActivityResponse) {}
}

message CheckRequest {}

message RecordActivityRequest {}
message RecordActivityResponse {
  // idle_millis AFTER the stamp, which is ~0 by construction. Returned rather
  // than left empty so a caller gets a positive confirmation the clock it
  // intended to reset is the one that moved — the same field Check reports, and
  // the only thing this RPC can honestly say about its effect.
  int64 idle_millis = 1;
}
message CheckResponse {
  bool ok = 1;
  // idle_millis is how long (in ms) since the sandbox's LAST I/O across ALL
  // processes + ptys — sandboxd stamps a single sandbox-global "last I/O" time
  // in the paths I/O already flows through (proc.broadcast output, writeInput
  // input) and reports now-lastIO here. It is measured guest-side on purpose: a
  // detached process still producing output with no client attached is invisible
  // to any host-side proxy, which would false-idle a working sandbox.
  //
  // ONLY meaningful when ok=true: it rides a SUCCESSFUL Health response, so a
  // transport-down / booting / dead guest yields no reading at all. The
  // classifier must therefore never read idle from a failed probe → never
  // misclassify an unreachable sandbox as idle. A guest with no I/O since boot
  // reports the ms since boot.
  int64 idle_millis = 2;
}

// ProcessService is the process primitive: start / connect / input / signal /
// resize / list. PTY is a field-level special case of Start, not a service.
// Output is fan-out multi-subscribe: many Connect calls can attach one pid, each
// receiving an independent copy.
service ProcessService {
  // Start launches a process and server-streams its output events
  // (start / data / end / keepalive). Addressed by the returned pid thereafter.
  rpc Start(StartRequest) returns (stream ProcessEvent) {}

  // Connect reattaches to an already-RUNNING process, replaying the bounded
  // output ring buffer first, then joining the live stream. Multiple Connect
  // calls can attach one pid.
  //
  // Only a live pid is addressable: once a process exits, its `end` event goes to
  // the subscribers attached AT THAT MOMENT and the pid stops resolving —
  // Connect then returns not-found, and exit status is NOT held for later
  // collection. That follows from addressing by guest-native pid, which the
  // kernel recycles: a retained "pid N exited" record would start describing a
  // different process the moment N is reused. A caller that needs exit status
  // must be attached when the process ends so the parent can reap the process group.
  rpc Connect(ConnectRequest) returns (stream ProcessEvent) {}

  // StreamInput writes stdin (or pty-in) as an ordered client-stream — the
  // interactive input path (keystrokes to a pty). Ordering is guaranteed by the
  // single stream.
  rpc StreamInput(stream StreamInputRequest) returns (StreamInputResponse) {}

  // SendInput writes stdin (or pty-in) once — unary, for when no stream is held.
  rpc SendInput(SendInputRequest) returns (SendInputResponse) {}

  // SendSignal signals a process; server defaults to the process group
  // (kill(-pgid)) falling back to kill(pid). Directed only; see
  // SendSignalRequest.pid for why pid <= 0 is refused.
  rpc SendSignal(SendSignalRequest) returns (SendSignalResponse) {}

  // Update resizes a process's PTY (unary; not a separate service, a process
  // field).
  rpc Update(UpdateRequest) returns (UpdateResponse) {}

  // CloseStdin closes a process's stdin (under a pty, equivalent to Ctrl-D).
  rpc CloseStdin(CloseStdinRequest) returns (CloseStdinResponse) {}

  // List enumerates live processes — no registry, scanned in real time.
  rpc List(ListRequest) returns (ListResponse) {}
}

message StartRequest {
  string cmd = 1;
  repeated string args = 2;
  repeated string env = 3;
  string cwd = 4;
  // No run-as field: the engine defaults to guest root and does not model guest
  // users — "run as user X" is a guest-native concern (su/sudo), not an engine
  // primitive. Field 5 is unused.
  // pty, when set, allocates a PTY of the given size.
  PtySize pty = 6;
}

message PtySize {
  uint32 rows = 1;
  uint32 cols = 2;
}

// ProcessEvent is one item of the output stream: oneof{start,data,end,
// keepalive}. keepalive is emitted periodically on long idle
// streams so intermediaries/clients know the connection is alive and don't
// reap it on silence; the stream has no idle read/write deadline.
message ProcessEvent {
  oneof kind {
    StartEvent start = 1;
    DataEvent data = 2;
    EndEvent end = 3;
    KeepaliveEvent keepalive = 4;
  }
}

message StartEvent {
  int32 pid = 1;
}

message DataEvent {
  // stream: "stdout" | "stderr" | "pty".
  string stream = 1;
  bytes data = 2;
}

message EndEvent {
  int32 exit_code = 1;
}

// KeepaliveEvent carries no payload — its arrival is the liveness signal.
message KeepaliveEvent {}

message ConnectRequest {
  int32 pid = 1;
}

// StreamInputRequest is one frame of the ordered input stream. pid is only read
// on the first frame of the stream (the stream targets one process).
message StreamInputRequest {
  int32 pid = 1;
  bytes data = 2;
  // pty_in selects the pty branch (write to the pty master) vs stdin.
  bool pty_in = 3;
}
message StreamInputResponse {}

message SendInputRequest {
  int32 pid = 1;
  bytes data = 2;
  // pty_in selects the pty branch (write to the pty master) vs stdin.
  bool pty_in = 3;
}
message SendInputResponse {}

message UpdateRequest {
  int32 pid = 1;
  PtySize pty = 2;
}
message UpdateResponse {}

message CloseStdinRequest {
  int32 pid = 1;
}
message CloseStdinResponse {}

message SendSignalRequest {
  // pid MUST be > 0 — a single directed process target. pid <= 0 is
  // `invalid_argument`, because in POSIX it is the fan-out form (kill(0) hits a
  // whole process group, kill(-1) the whole pid namespace) and container-level
  // fan-out belongs to guest PID 1, not this channel. So it is not merely a
  // dangerous value: it is addressed to the wrong subsystem.
  //
  // Kept `int32`, NOT `uint32`, on purpose: unsigned would silently reinterpret a
  // wire negative as a huge positive pid, trading an explicit 400 for a subtler
  // behavior (a signal delivered to nothing, or to an unrelated recycled pid).
  int32 pid = 1;
  int32 signal = 2;
}
message SendSignalResponse {}

message ListRequest {}
message ListResponse {
  repeated int32 pids = 1;
}

// FsService is the fs primitive: all RPCs are unary and there is no watch.
//
// No watch, deliberately: a subscription would make the engine hold merge /
// reconnect state and break transport statelessness, and inotify on a gVisor
// overlay upperdir is unreliable. Consumers poll Stat+Read instead.
//
// Byte-carrying calls are bounded by the RPC message size on purpose; large
// files use the HTTP multipart bypass rather than growing a chunked RPC.
service FsService {
  // Read reads sandbox file bytes at an offset. The engine keeps no read
  // cursor and no cross-resume offset continuity.
  rpc Read(ReadRequest) returns (ReadResponse) {}

  // Write writes sandbox file bytes (whole-file, offset 0).
  rpc Write(WriteRequest) returns (WriteResponse) {}

  // Stat describes one path. LSTAT semantics: a symlink is reported AS a
  // symlink (with symlink_target set), never silently followed — the caller
  // asked about this path, and there is no Readlink RPC to recover the target
  // with if we collapsed it here.
  rpc Stat(StatRequest) returns (StatResponse) {}

  // List enumerates a directory, up to depth levels deep, FLATTENED into one
  // list. Every entry carries its absolute path, so a flat result is
  // unambiguous. No pagination: the engine does not hold a cursor.
  rpc List(FsServiceListRequest) returns (FsServiceListResponse) {}

  // MakeDir creates a directory, CREATING PARENTS (mkdir -p). An existing
  // directory is already_exists — the caller may treat that as benign, but the
  // server does not erase the distinction.
  rpc MakeDir(MakeDirRequest) returns (MakeDirResponse) {}

  // Remove deletes a path RECURSIVELY, and is IDEMPOTENT: removing something
  // that is not there succeeds. There is no `recursive` flag — for a trusted
  // caller the non-recursive mode is a footgun with no upside, and it would add
  // an error branch ("directory not empty") every caller must then handle.
  rpc Remove(RemoveRequest) returns (RemoveResponse) {}

  // Move renames source to destination, creating destination parents and
  // OVERWRITING an existing destination (rename(2) semantics). Returns the
  // entry at its new path. A cross-device move is rejected explicitly rather
  // than silently copying — see the EXDEV note on the guest implementation.
  rpc Move(MoveRequest) returns (MoveResponse) {}
}

// EntryType is what a path IS. UNSPECIFIED is deliberately the zero value: a
// client that meets a type it does not know skips the entry instead of
// misreading it, so adding a type later is additive.
enum EntryType {
  ENTRY_TYPE_UNSPECIFIED = 0;
  ENTRY_TYPE_FILE = 1;
  ENTRY_TYPE_DIRECTORY = 2;
  ENTRY_TYPE_SYMLINK = 3;
}

// EntryInfo describes one filesystem entry. Built by ONE constructor shared by
// Stat and List, so the two can never disagree about the same path.
//
// No owner / group / permission-string fields: the engine does not model guest
// users; "run as user X" is guest-native. A display string is derivable from
// mode by the caller.
message EntryInfo {
  // name is the base name; path is absolute in the GUEST's namespace.
  string name = 1;
  string path = 2;
  EntryType type = 3;
  int64 size = 4;
  // mode is the full st_mode including type bits, numeric — not a display
  // string, so no information is lost on the wire.
  uint32 mode = 5;
  int64 mtime_unix_nano = 6;
  // symlink_target is set IFF type == SYMLINK, absolutized against the link's
  // own directory (a relative target is meaningless to a remote caller).
  optional string symlink_target = 7;
}

message StatRequest {
  string path = 1;
}
message StatResponse {
  EntryInfo entry = 1;
}

// FsServiceListRequest is the fs directory listing. Service-prefixed because
// proto messages share ONE namespace and ProcessService.List already owns
// List{Request,Response} — this is also the spelling buf lint prescribes for the
// collision.
message FsServiceListRequest {
  string path = 1;
  // depth 1 = immediate children; N = N levels, flattened. Must be >= 1 —
  // 0 is not a sentinel for "unlimited", it is invalid_argument.
  uint32 depth = 2;
}
message FsServiceListResponse {
  repeated EntryInfo entries = 1;
}

message MakeDirRequest {
  string path = 1;
}
message MakeDirResponse {
  EntryInfo entry = 1;
}

message RemoveRequest {
  string path = 1;
}
message RemoveResponse {}

message MoveRequest {
  string source = 1;
  string destination = 2;
}
message MoveResponse {
  EntryInfo entry = 1;
}

message ReadRequest {
  string path = 1;
  int64 offset = 2;
  // length <= 0 means "to EOF".
  int64 length = 3;
}
message ReadResponse {
  bytes data = 1;
}

message WriteRequest {
  string path = 1;
  bytes data = 2;
}
message WriteResponse {
  int64 bytes_written = 1;
}
